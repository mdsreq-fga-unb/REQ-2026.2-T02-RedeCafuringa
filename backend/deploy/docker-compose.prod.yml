# Produção na Oracle Cloud (Always Free, ARM Ampere A1, São Paulo).
# Uso na VM:  docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# O MongoDB não expõe porta para fora da rede interna do compose.
#
# Variáveis obrigatórias usam ${VAR:?mensagem}: o Compose falha em vez de
# subir com credenciais/domínio/CORS em branco.
services:
  mongo:
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '${MONGO_WIREDTIGER_CACHE_GB:-0.5}']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER é obrigatório}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD é obrigatório}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cafuringa}
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER é obrigatório}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD é obrigatório}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp:size=64m
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: ..
    image: rede-cafuringa-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${API_MEM_LIMIT:-512m}
    stop_grace_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Componentes separados: a API monta a URI com encodeURIComponent,
      # então senhas com @, :, /, ? ou # não quebram a conexão.
      MONGODB_HOST: mongo:27017
      MONGODB_DB: ${MONGO_DB:-cafuringa}
      MONGODB_USER: ${MONGO_APP_USER:?MONGO_APP_USER é obrigatório}
      MONGODB_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD é obrigatório}
      MONGODB_AUTH_SOURCE: ${MONGO_DB:-cafuringa}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS é obrigatório}
      TRUST_PROXY: '1'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    networks:
      - edge
      - internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -qO- \"http://127.0.0.1:$${PORT:-3000}/api/v1/health/live\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN é obrigatório}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
  internal:
    internal: true

volumes:
  mongo-data:
  mongo-config:
  caddy-data:
  caddy-config:
