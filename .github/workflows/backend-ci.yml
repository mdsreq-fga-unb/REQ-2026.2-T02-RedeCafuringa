name: Backend CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Contract drift (shared/openapi.json)
        run: |
          npm run openapi:export
          git diff --exit-code -- ../shared/openapi.json || {
            echo '::error::shared/openapi.json está desatualizado. Rode npm run openapi:export no backend e commite o resultado.'
            exit 1
          }

      - name: Referência da API (docs/shared/api.md)
        working-directory: .
        run: |
          node scripts/gen-api-docs.mjs
          git diff --exit-code -- docs/shared/api.md || {
            echo '::error::docs/shared/api.md está desatualizado. Rode ./scripts/dev.sh contract e commite o resultado.'
            exit 1
          }

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests + coverage
        run: npm run test:cov

      - name: Cache MongoDB binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ hashFiles('backend/package-lock.json') }}

      - name: E2E tests
        run: npm run test:e2e

      - name: Build Docker image
        run: docker build -t rede-cafuringa-api:ci .

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:2.12.0 hadolint - < Dockerfile
