site_name: Rede Cafuringa
site_description: 'Repositório de projeto da disciplina de REQ-T1, 2026.2'
site_author: 'Equipe Bytelab'

theme: 
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  language: pt-BR
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: black
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  

extra_css:
  - stylesheets/extra.css
  - stylesheets/organizacao-requisitos.css
extra_javascript:
  - javascript/extra.js
  - javascript/hu-filters.js
  - javascript/hu-modal.js
  - javascript/hu-table.js

nav:
  - Início: index.md
  - Visão Geral:
    - 1. Cenário Atual do Cliente e do Negócio: visao/cenario.md
    - 2. Solução Proposta: visao/solucao.md
    - 3. Intervenção Social: visao/intervencao.md
    - 4. Estratégias de Engenharia de Software: visao/estrategias.md
    - 5. Engenharia de Requisitos: visao/engenharia_requisitos.md
    - 6. Interação Entre Equipe e Cliente: visao/interacao.md
    - 7. Requisitos de Software: visao/requisitos_software.md
    - 8. DoR e DoD: visao/dor_dod.md
    - 9. Backlog: visao/historias_usuario.md
    - 10. MVP: visao/mvp.md
    - 11. Cronograma: visao/cronograma.md
    - 12. Lições Aprendidas: visao/licoes_aprendidas.md
    - 13. Referências Bibliográficas: visao/referencias.md
    - 14. Vídeo de Apresentação: visao/videos.md

  - Organização e Atualização:
    - Visão Geral: organizacao_atualizacao/index.md
    - Rastreabilidade: organizacao_atualizacao/rastreabilidade.md
    - Gestão de Mudanças: organizacao_atualizacao/atualizacao.md

  - AUP - Iterações:
    - Concepção:
      - Iteração 1: visao/evidencias/iteracao1.md
      - Iteração 2: visao/evidencias/iteracao2.md
    - Elaboração:
      - Iteração 3: visao/evidencias/iteracao3.md
      - Iteração 4: visao/evidencias/iteracao4.md
    - Construção:
      - Iteração 5: visao/evidencias/iteracao5.md
      - Iteração 6: visao/evidencias/iteracao6.md
      - Iteração 7: visao/evidencias/iteracao7.md
      - Iteração 8: visao/evidencias/iteracao8.md
    - Transição:
      - Iteração 9: visao/evidencias/iteracao9.md
      - Iteração 10: visao/evidencias/iteracao10.md

  - Arquitetura:
    - Backend:
        - POC: arquitetura/backend/poc.md
        - Guia de estrutura e TDD: arquitetura/backend/guia-estrutura-e-tdd.md
        - Operação e infraestrutura: arquitetura/backend/operacao.md
        - Segurança e auditoria: arquitetura/backend/seguranca.md
        - Implementação das HUs:
            - HU09 — Autenticar usuário: arquitetura/backend/implementacao/HU09.md
            - HU10 — Recuperar acesso: arquitetura/backend/implementacao/HU10.md
            - HU12 — Trajetória do produtor: arquitetura/backend/implementacao/HU12.md
    - Frontend:
        - Operação: arquitetura/frontend/operacao.md
    - Engenharia:
        - Como contribuir: arquitetura/contribuindo.md
        - Padrão de Pull Request: arquitetura/pull-requests.md
        - Infraestrutura: arquitetura/infra/visao-geral.md
    - Contrato da API:
        - Referência da API (Swagger): arquitetura/shared/api.md
        - Versionamento e contrato: arquitetura/shared/contratos.md

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
