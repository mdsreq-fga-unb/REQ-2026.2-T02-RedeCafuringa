site_name: Rede Cafuringa
site_description: 'Repositório de projeto da disciplina de REQ-T1, 2026.2'
site_author: 'Equipe Bytelab'

theme: 
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  language: pt-BR
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: black
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascript/extra.js

nav:
  - Início: index.md

  - Visão do Projeto:
    - 1. Cenário Atual do Cliente e do Negócio: visao/cenario.md
    - 2. Solução Proposta: visao/solucao.md
    - 3. Intervenção Social: visao/intervencao.md
    - 4. Estratégias de Engenharia de Software: visao/estrategias.md
    - 5. Engenharia de Requisitos: visao/engenharia_requisitos.md
    - 6. Interação Entre Equipe e Cliente: visao/interacao.md
    - 7. Requisitos de Software: visao/requisitos_software.md
    - 8. DoR e DoD: visao/dor_dod.md
    - 9. Backlog do Produto: visao/backlog.md
    - 10. Cronograma: visao/cronograma.md
    - 11. Lições Aprendidas: visao/licoes_aprendidas.md
    - 12. Referências Bibliográficas: visao/referencias.md
    - 13. Vídeo de Apresentação: visao/videos.md

  - Documentação Complementar: 
    - 1. Regras de Negócio: doc_complementar/regras_negocio.md 
    - 2. Declaração de Requisitos: doc_complementar/declaracao_requisitos.md 
    - 3. Critérios de Aceitação: doc_complementar/criterios_aceitacao.md

  - Backend:
    - POC: backend/poc.md
    - Guia de estrutura e TDD: backend/guia-estrutura-e-tdd.md
    - Operação e infraestrutura: backend/operacao.md
    - Segurança e auditoria: backend/seguranca.md

  - AUP - Concepção:
    - Iteração 01: aup-concepcao/iteracao1.md
    - Iteração 02: aup-concepcao/iteracao2.md

  - AUP - Elaboração:
    - Iteração 03: aup-elaboracao/iteracao3.md
    - Iteração 04: aup-elaboracao/iteracao4.md

  - AUP - Construção:
    - Iteração 05: aup-construcao/iteracao5.md
    - Iteração 06: aup-construcao/iteracao6.md
    - Iteração 07: aup-construcao/iteracao7.md
    - Iteração 08: aup-construcao/iteracao8.md

  - AUP - Transição:
    - Iteração 09: aup-transicao/iteracao9.md
    - Iteração 10: aup-transicao/iteracao10.md


markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
