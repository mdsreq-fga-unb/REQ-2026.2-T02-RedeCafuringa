# Cabeçalhos de segurança. Incluído em cada location porque add_header num
# location substitui (não herda) os do nível acima.
# A Content-Security-Policy vem de csp.conf, gerado no build da imagem
# (nginx/gen-csp.ts) a partir de VITE_API_URL.
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
