# Cabeçalhos de segurança. Incluído em cada location porque add_header num
# location substitui (não herda) os do nível acima.
# A Content-Security-Policy entra na etapa de infra do front, quando a URL da
# API de produção estiver definida.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
